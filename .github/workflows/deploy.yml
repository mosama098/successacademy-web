name: Deploy Success Academy

on:
  push:
    branches:
      - main

concurrency:
  group: successacademy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/successacademy_key
          chmod 600 ~/.ssh/successacademy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Contabo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/successacademy_key "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e

          cd /opt/successacademy-web

          echo "=== Pulling latest main ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Loading public build variables ==="
          set -a
          source .env.local
          set +a

          echo "=== Building new Docker image ==="
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL \
            --build-arg NEXT_PUBLIC_GTM_ID \
            --build-arg NEXT_PUBLIC_GA4_ID \
            --build-arg NEXT_PUBLIC_META_PIXEL_ID \
            --build-arg NEXT_PUBLIC_TIKTOK_PIXEL_ID \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER \
            --build-arg NEXT_PUBLIC_CALL_NUMBER \
            --build-arg NEXT_PUBLIC_FACEBOOK_URL \
            --build-arg NEXT_PUBLIC_INSTAGRAM_URL \
            --build-arg NEXT_PUBLIC_TIKTOK_URL \
            --build-arg NEXT_PUBLIC_YOUTUBE_URL \
            --build-arg NEXT_PUBLIC_LINKEDIN_URL \
            -t successacademy-main-web:deploy .

          echo "=== Preparing safe container replacement ==="
          docker rm -f successacademy-main-web-backup 2>/dev/null || true

          if docker ps -a --format '{{.Names}}' | grep -qx 'successacademy-main-web'; then
            docker stop successacademy-main-web
            docker rename successacademy-main-web successacademy-main-web-backup
          fi

          echo "=== Starting new version ==="
          mkdir -p /opt/successacademy-web/.placement-data
          chmod 700 /opt/successacademy-web/.placement-data

          if docker run -d \
            --name successacademy-main-web \
            --restart unless-stopped \
            --env-file /opt/successacademy-web/.env.local \
            --network my-project_default \
            -v /opt/successacademy-web/.placement-data:/app/data/placement-test \
            -p 127.0.0.1:3002:3000 \
            successacademy-main-web:deploy
          then
            echo "Container started."
          else
            echo "New container failed to start. Rolling back."
            docker rm -f successacademy-main-web 2>/dev/null || true

            if docker ps -a --format '{{.Names}}' | grep -qx 'successacademy-main-web-backup'; then
              docker rename successacademy-main-web-backup successacademy-main-web
              docker start successacademy-main-web
            fi

            exit 1
          fi

          echo "=== Health check ==="
          HEALTHY=false

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3002/ >/dev/null; then
              HEALTHY=true
              break
            fi

            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "Health check failed. Rolling back."

            docker rm -f successacademy-main-web

            if docker ps -a --format '{{.Names}}' | grep -qx 'successacademy-main-web-backup'; then
              docker rename successacademy-main-web-backup successacademy-main-web
              docker start successacademy-main-web
            fi

            exit 1
          fi

          echo "=== Deployment healthy ==="
          docker rm -f successacademy-main-web-backup 2>/dev/null || true

          echo "Success Academy deployed successfully."
          REMOTE
